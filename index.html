<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Brilliant Kid's Academy — School ERP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Arial,sans-serif}:root{--n:#14305a;--n2:#0b1c33;--g:#e8a317;--bg:#f1f4f9;--r:#d64545;--ok:#16845b}
body{background:var(--bg);color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}[hidden]{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b1c33,#14305a);padding:20px}
.lc{width:min(420px,100%);background:#fff;border-radius:22px;padding:32px;border-top:6px solid var(--g)}.lc h1{color:var(--n);text-align:center;font-size:22px}.lc p{text-align:center;color:#64748b;margin:6px 0 18px;font-size:14px}
.f{margin:10px 0}.f label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.f input,.f select,.f textarea{width:100%;padding:11px;border:1px solid #d6dce5;border-radius:9px;background:#fafbfd}
.b{padding:10px 15px;border-radius:10px;background:var(--n);color:#fff;font-weight:700}.b.g{background:var(--ok)}.b.r{background:var(--r)}.b.y{background:var(--g);color:#111}.w{width:100%;margin-top:8px}
aside{position:fixed;left:0;top:0;bottom:0;width:230px;background:linear-gradient(180deg,#0b1c33,#12294a);color:#fff;padding:16px;overflow:auto}aside h2{font-size:15px;padding:6px 4px 14px;border-bottom:1px solid #fff2}
aside button{display:block;width:100%;text-align:left;background:none;color:#dbe5ef;padding:11px 12px;border-radius:10px;margin:3px 0;font-weight:600;border-left:3px solid transparent}aside button.on{background:#ffffff1c;border-left-color:var(--g);color:#fff}
main{margin-left:230px;padding:22px}h3{color:var(--n);margin-bottom:12px}.p{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #14305a10}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}.c{background:#fff;border-radius:16px;padding:16px;border-top:4px solid var(--g);box-shadow:0 4px 18px #14305a12}.c b{display:block;font-size:28px;color:var(--n);margin-top:6px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.sc{overflow:auto}table{width:100%;border-collapse:collapse}th{background:var(--n);color:#fff;text-align:left}th,td{padding:9px;font-size:13px;border-bottom:1px solid #e8edf3}tr:nth-child(even) td{background:#f7f9fc}
.bd{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#e9f7f1;color:var(--ok)}.bd.r{background:#fdecec;color:var(--r)}.bd.y{background:#fff4dc;color:#b7791f}.nt{padding:11px;background:#fff8e8;border-left:4px solid var(--g);border-radius:8px;margin:8px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 18px;border-radius:10px;z-index:9}
@media(max-width:800px){aside{position:static;width:100%;display:flex;gap:4px;overflow:auto;padding:8px}aside h2{display:none}aside button{width:auto;white-space:nowrap}main{margin:0;padding:12px}}
</style></head><body>
<div id="login"><div class="lc"><h1>The Brilliant Kid's Academy</h1><p>Mehgaon • School ERP Portal</p>
<div class="f"><label>Login ID</label><input id="lid" autocomplete="username" placeholder="Admin email / Teacher ID / Student ID"></div>
<div class="f"><label>Password</label><input id="lpw" type="password" autocomplete="current-password"></div>
<button class="b w" id="lbtn">Login</button><p id="lerr" style="color:#d64545;margin-top:10px"></p></div></div>
<div id="app" hidden><aside><h2>The Brilliant Kid's Academy<br><small id="who" style="font-weight:400;color:#aebdce"></small></h2><nav id="nav"></nav></aside><main id="main"></main></div><div id="toast" hidden></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,deleteDoc,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyALLEOhbdCWsCPm4KpJbqgtmvP7lydFYUg",authDomain:"tbkaschool.firebaseapp.com",projectId:"tbkaschool",storageBucket:"tbkaschool.firebasestorage.app",messagingSenderId:"470937341421",appId:"1:470937341421:web:6ce15210f525bcb5d2ebe4"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const mail=i=>i.includes('@')?i.trim():i.trim().toLowerCase()+'@tbka.school';
const CLASSES=['Play Group','Nursery','LKG','UKG','Class 1','Class 2','Class 3','Class 4','Class 5','Class 6','Class 7','Class 8'];
const SUBJ=c=>['Class 6','Class 7','Class 8'].includes(c)?['English','Science','Mathematics','Hindi','Social Science','Sanskrit','Computer','General Knowledge']:['Hindi','English','Mathematics','EVS','Computer','General Knowledge','Drawing'];
const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,2800)};
const opts=a=>a.map(x=>`<option value="${esc(x[0]??x)}">${esc(x[1]??x)}</option>`).join('');
const docs=async(c,...w)=>(await getDocs(w.length?query(collection(db,c),...w):collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
let me=null,students=[];
const NAV={admin:[['dash','🏠 Dashboard'],['stu','👨‍🎓 Students'],['att','🕐 Attendance'],['fee','💰 Fees'],['mar','📚 Marks'],['not','📢 Notices'],['usr','🔑 Logins'],['bak','💾 Backup']],
 teacher:[['dash','🏠 Dashboard'],['stu','👨‍🎓 Students'],['att','🕐 Attendance'],['mar','📚 Marks'],['not','📢 Notices']],
 parent:[['dash','👨‍🎓 My Child'],['att','🕐 Attendance'],['fee','💰 Fees'],['mar','📚 Marks'],['not','📢 Notices']]};
$('lbtn').onclick=async()=>{$('lerr').textContent='';try{await signInWithEmailAndPassword(auth,mail($('lid').value),$('lpw').value)}catch(e){$('lerr').textContent='Login ID ya password galat hai.'}};
$('lpw').onkeydown=e=>e.key==='Enter'&&$('lbtn').click();
onAuthStateChanged(auth,async u=>{if(!u){$('app').hidden=true;$('login').hidden=false;return}
 const s=await getDoc(doc(db,'users',u.uid));if(!s.exists()){$('lerr').textContent='Ye account abhi set nahi hua. Admin se sampark karein.';await signOut(auth);return}
 me=s.data();students=me.role==='parent'?[{id:me.studentId,...(await getDoc(doc(db,'students',me.studentId))).data()}]:await docs('students');
 students.sort((a,b)=>a.id.localeCompare(b.id));$('login').hidden=true;$('app').hidden=false;$('who').textContent=`${me.name||''} (${me.role})`;
 $('nav').innerHTML=NAV[me.role].map(n=>`<button data-v="${n[0]}">${n[1]}</button>`).join('')+'<button id="out">🚪 Logout</button>';
 $('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='out')return signOut(auth);go(b.dataset.v)};go('dash')});
async function go(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('main').innerHTML='<div class="p">Loading…</div>';try{await V[v]()}catch(e){console.error(e);$('main').innerHTML='<div class="p">Error: '+esc(e.code||e.message)+'</div>'}}
const sel=(id,l)=>`<div class="f"><label>${l}</label><select id="${id}">${opts(students.map(s=>[s.id,`${s.name} — ${s.className} (${s.id})`]))}</select></div>`;
const V={
async dash(){const m=$('main');if(me.role==='parent'){const s=students[0];m.innerHTML=`<h3>${esc(s.name)}</h3><div class="p"><div class="g2"><div><b>Admission No:</b> ${s.id}</div><div><b>Class:</b> ${esc(s.className)}</div><div><b>Father:</b> ${esc(s.father||'-')}</div><div><b>Mother:</b> ${esc(s.mother||'-')}</div><div><b>Mobile:</b> ${esc(s.mobile||'-')}</div><div><b>DOB:</b> ${esc(s.dob||'-')}</div></div></div>`;return}
 const at=await docs('attendance',where('date','==',today())),fe=me.role==='admin'?await docs('fees'):[],pr=at.filter(a=>a.status==='Present').length;
 m.innerHTML=`<h3>Dashboard</h3><div class="cards"><div class="c">Students<b>${students.length}</b></div><div class="c">Present today<b>${pr}</b></div><div class="c">Absent today<b>${at.filter(a=>a.status==='Absent').length}</b></div>${me.role==='admin'?`<div class="c">Fees collected<b>₹${fe.reduce((a,x)=>a+x.amount,0).toLocaleString('en-IN')}</b></div><div class="c">Fees due<b>₹${Math.max(0,students.reduce((a,s)=>a+Number(s.fee||0),0)-fe.reduce((a,x)=>a+x.amount,0)).toLocaleString('en-IN')}</b></div>`:''}</div>`},
async stu(){const adm=me.role==='admin';$('main').innerHTML=`<h3>Students</h3><div class="p"><h3>New Admission</h3><div class="g2"><div class="f"><label>Name *</label><input id="n"></div><div class="f"><label>Class</label><select id="c">${opts(CLASSES)}</select></div><div class="f"><label>Father</label><input id="fa"></div><div class="f"><label>Mother</label><input id="mo"></div><div class="f"><label>Mobile</label><input id="mb" inputmode="numeric"></div><div class="f"><label>DOB</label><input id="dob" type="date"></div><div class="f"><label>Yearly Fee ₹</label><input id="fee" type="number" value="15000"></div></div><button class="b g" id="add">Save Admission</button></div>
<div class="p"><div class="f"><input id="q" placeholder="Search by name / ID / class"></div><div class="sc"><table><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Father</th><th>Mobile</th>${adm?'<th></th>':''}</tr></thead><tbody id="tb"></tbody></table></div></div>`;
 const draw=()=>{const q=$('q').value.toLowerCase();$('tb').innerHTML=students.filter(s=>(s.name+s.id+s.className).toLowerCase().includes(q)).map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.className)}</td><td>${esc(s.father||'-')}</td><td>${esc(s.mobile||'-')}</td>${adm?`<td><button class="b r" data-d="${s.id}">Delete</button></td>`:''}</tr>`).join('')||'<tr><td colspan=6>Koi student nahi.</td></tr>'};draw();$('q').oninput=draw;
 $('tb').onclick=async e=>{const id=e.target.dataset.d;if(id&&confirm('Student delete karein?')){await deleteDoc(doc(db,'students',id));students=students.filter(s=>s.id!==id);draw()}};
 $('add').onclick=async()=>{const n=$('n').value.trim();if(!n)return toast('Name likhein');const id='TBKA'+String(Math.max(0,...students.map(s=>parseInt(s.id.replace(/\D/g,''))||0))+1).padStart(4,'0');
  const s={name:n,className:$('c').value,father:$('fa').value.trim(),mother:$('mo').value.trim(),mobile:$('mb').value.trim(),dob:$('dob').value,fee:Number($('fee').value||0)};await setDoc(doc(db,'students',id),s);students.push({id,...s});toast('Saved: '+id);V.stu()}},
async att(){const m=$('main');if(me.role==='parent'){const a=(await docs('attendance',where('studentId','==',students[0].id))).sort((x,y)=>y.date.localeCompare(x.date));m.innerHTML=`<h3>Attendance</h3><div class="p"><table><tr><th>Date</th><th>Status</th></tr>${a.map(x=>`<tr><td>${x.date}</td><td><span class="bd ${x.status==='Absent'?'r':x.status==='Leave'?'y':''}">${x.status}</span></td></tr>`).join('')||'<tr><td colspan=2>Record nahi hai.</td></tr>'}</table></div>`;return}
 m.innerHTML=`<h3>Attendance</h3><div class="p"><div class="g2"><div class="f"><label>Class</label><select id="c">${opts(CLASSES)}</select></div><div class="f"><label>Date</label><input id="d" type="date" value="${today()}"></div></div><div class="sc"><table><tbody id="tb"></tbody></table></div><button class="b g" id="sv">Save Attendance</button> <button class="b y" id="ap">Sab Present</button></div>`;
 let st={};const draw=async()=>{const c=$('c').value,d=$('d').value,ex=await docs('attendance',where('date','==',d));st={};ex.forEach(x=>st[x.studentId]=x.status);
  $('tb').innerHTML='<tr><th>ID</th><th>Name</th><th>Status</th></tr>'+students.filter(s=>s.className===c).map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${['Present','Absent','Leave'].map(x=>`<label style="margin-right:8px"><input type="radio" name="${s.id}" value="${x}" ${st[s.id]===x?'checked':''}> ${x}</label>`).join('')}</td></tr>`).join('')};
 $('c').onchange=draw;$('d').onchange=draw;await draw();$('ap').onclick=()=>document.querySelectorAll('#tb input[value=Present]').forEach(i=>i.checked=true);
 $('sv').onclick=async()=>{const d=$('d').value,c=$('c').value,jobs=[];document.querySelectorAll('#tb input:checked').forEach(i=>jobs.push(setDoc(doc(db,'attendance',d+'_'+i.name),{studentId:i.name,date:d,className:c,status:i.value,by:me.name||''})));await Promise.all(jobs);toast(jobs.length+' records saved')}},
async fee(){const m=$('main');const own=me.role==='parent',f=own?await docs('fees',where('studentId','==',students[0].id)):await docs('fees');f.sort((a,b)=>b.date.localeCompare(a.date));
 const rows=f.map(x=>`<tr><td>${x.date}</td><td>${x.id}</td><td>${esc(x.studentName||x.studentId)}</td><td>₹${x.amount}</td><td>${esc(x.mode)}</td></tr>`).join('')||'<tr><td colspan=5>Record nahi hai.</td></tr>';
 const form=own?'':`<div class="p"><h3>Fee Receive</h3>${sel('s','Student')}<div class="g2"><div class="f"><label>Amount ₹</label><input id="a" type="number"></div><div class="f"><label>Mode</label><select id="md"><option>Cash</option><option>UPI</option><option>Bank</option></select></div><div class="f"><label>Date</label><input id="dt" type="date" value="${today()}"></div></div><button class="b g" id="sv">Save Receipt</button></div>`;
 m.innerHTML=`<h3>Fees</h3>${form}<div class="p"><div class="sc"><table><tr><th>Date</th><th>Receipt</th><th>Student</th><th>Amount</th><th>Mode</th></tr>${rows}</table></div></div>`;
 if(!own)$('sv').onclick=async()=>{const s=students.find(x=>x.id===$('s').value),a=Number($('a').value);if(!s||a<=0)return toast('Student aur amount sahi likhein');await setDoc(doc(db,'fees','REC'+Date.now()),{studentId:s.id,studentName:s.name,amount:a,mode:$('md').value,date:$('dt').value});toast('Receipt saved');V.fee()}},
async mar(){const m=$('main'),own=me.role==='parent',EX=['Unit Test','Half Yearly','Annual'];
 m.innerHTML=`<h3>Marks</h3><div class="p">${own?'':sel('s','Student')}<div class="f"><label>Exam</label><select id="e">${opts(EX)}</select></div><div id="g"></div>${own?'':'<button class="b g" id="sv">Save Marks</button>'}</div>`;
 const draw=async()=>{const s=students.find(x=>x.id===(own?students[0].id:$('s').value));if(!s)return;const r=await getDoc(doc(db,'marks',s.id+'_'+$('e').value)),mk=r.exists()?r.data().marks:{};let o=0,t=0;
  $('g').innerHTML='<table><tr><th>Subject</th><th>Marks (out of 100)</th></tr>'+SUBJ(s.className).map(x=>{if(mk[x]!==undefined&&mk[x]!==''){o+=Number(mk[x]);t+=100}return `<tr><td>${x}</td><td>${own?esc(mk[x]??'-'):`<input data-s="${esc(x)}" type="number" min="0" max="100" value="${esc(mk[x]??'')}">`}</td></tr>`}).join('')+`</table>${t?`<p style="margin-top:8px"><b>Total:</b> ${o}/${t} (${(o*100/t).toFixed(1)}%)</p>`:''}`};
 if(!own)$('s').onchange=draw;$('e').onchange=draw;await draw();
 if(!own)$('sv').onclick=async()=>{const id=$('s').value,mk={};document.querySelectorAll('#g input').forEach(i=>mk[i.dataset.s]=i.value===''?'':Math.min(100,Math.max(0,Number(i.value))));await setDoc(doc(db,'marks',id+'_'+$('e').value),{studentId:id,exam:$('e').value,marks:mk});toast('Marks saved');draw()}},
async not(){const n=(await docs('notices')).sort((a,b)=>b.date.localeCompare(a.date));$('main').innerHTML=`<h3>Notices</h3>${me.role==='admin'?'<div class="p"><div class="f"><label>Title</label><input id="t"></div><div class="f"><label>Notice</label><textarea id="x" rows="3"></textarea></div><button class="b" id="pb">Publish</button></div>':''}${n.map(x=>`<div class="nt"><b>${esc(x.title)}</b> <small>(${x.date})</small><br>${esc(x.text)}${me.role==='admin'?` <button class="b r" data-d="${x.id}" style="padding:3px 8px">✕</button>`:''}</div>`).join('')||'<div class="p">Koi notice nahi.</div>'}`;
 if(me.role==='admin'){$('pb').onclick=async()=>{const t=$('t').value.trim(),x=$('x').value.trim();if(!t||!x)return toast('Title aur notice likhein');await setDoc(doc(db,'notices','N'+Date.now()),{title:t,text:x,date:today()});V.not()};$('main').onclick=async e=>{const d=e.target.dataset.d;if(d&&confirm('Delete?')){await deleteDoc(doc(db,'notices',d));V.not()}}}},
async usr(){const us=await docs('users');$('main').innerHTML=`<h3>Logins</h3><div class="p"><h3>Parent Login (student ID = Login ID)</h3>${sel('ps','Student')}<div class="f"><label>Password (min 6)</label><input id="pp"></div><button class="b g" id="pb">Create Parent Login</button></div>
<div class="p"><h3>Teacher Login</h3><div class="g2"><div class="f"><label>Name</label><input id="tn"></div><div class="f"><label>Login ID (e.g. ravi)</label><input id="ti"></div><div class="f"><label>Password (min 6)</label><input id="tp"></div></div><button class="b g" id="tb2">Create Teacher Login</button></div>
<div class="p"><h3>Existing</h3><table><tr><th>Name</th><th>Role</th><th>Student</th></tr>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${u.role}</td><td>${esc(u.studentId||'')}</td></tr>`).join('')}</table><p style="color:#64748b;font-size:12px;margin-top:8px">Password reset / login hatane ke liye Firebase Console → Authentication use karein.</p></div>`;
 const mk=async(id,pw,data)=>{if(pw.length<6)return toast('Password kam se kam 6 character');try{const sa=initializeApp(cfg,'s'+Date.now()),a=getAuth(sa),c=await createUserWithEmailAndPassword(a,mail(id),pw);await setDoc(doc(db,'users',c.user.uid),data);await signOut(a);toast('Login ban gaya: '+id);V.usr()}catch(e){toast(e.code==='auth/email-already-in-use'?'Ye ID pehle se hai':'Error: '+e.code)}};
 $('pb').onclick=()=>{const s=students.find(x=>x.id===$('ps').value);if(s)mk(s.id,$('pp').value,{role:'parent',studentId:s.id,name:'Parent of '+s.name})};
 $('tb2').onclick=()=>{const i=$('ti').value.trim();if(!i||!$('tn').value.trim())return toast('Name aur ID likhein');mk(i,$('tp').value,{role:'teacher',name:$('tn').value.trim()})}},
async bak(){$('main').innerHTML='<h3>Backup</h3><div class="p"><p style="margin-bottom:10px">Poora data (students, attendance, fees, marks, notices) ek file mein download hoga. File ko sirf private Google Drive / apne computer mein rakhein, WhatsApp par nahi.</p><button class="b g" id="bk">⬇ Download Backup</button></div>';
 $('bk').onclick=async()=>{const o={date:today()};for(const c of['students','attendance','fees','marks','notices'])o[c]=await docs(c);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='TBKA_backup_'+today()+'.json';a.click()}}};
</script></body></html>
